<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2000円</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        img {
            max-width: 80%;
            height: auto;
        }
    </style>
</head>
<body>
    <img src="2000.png" alt="2000円の画像">

    <!-- 🎵 結果ページ用の音声 -->
    <audio id="resultSound" src="cong.mp3"></audio>

    <script>
        window.onload = () => {
            setTimeout(() => {
                const audio = document.getElementById("resultSound");
                audio.currentTime = 0; // 毎回最初から再生
                audio.play();
            }, 1000); // 1秒後に再生
        };
    </script>
</body>
</html>
