<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おとしだまちゃれんじ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: 'Kosugi Maru', sans-serif; /* フォントファミリーを設定 */
        }
        .small-image {
            width: 90%; /* デフォルト幅を90%に設定 */
            height: auto; /* 高さを自動調整 */
            max-width: 750px; /* 最大幅を750ピクセルに設定 */
        }
        .horizontal-image-links {
            display: flex;
            gap: 30px; /* 画像間の間隔を設定 */
            justify-content: center;
            margin: 50px 0; /* 上下のギャップを設定 */
        }
        .image-link {
            border: none;
            background: none;
        }
        .image {
            max-width: 100%;
            height: auto;
        }
        .text {
            display: flex;
            align-items: center;
            font-size: 48px; /* フォントサイズを設定 */
            font-weight: bold; /* 文字を太字に設定 */
            margin-bottom: 10px; /* 下の余白を追加 */
        }

        /* タブレット向けのスタイル */
        @media (max-width: 768px) {
            .small-image {
                width: 80%; /* タブレットでは幅を80%に設定 */
            }
            .horizontal-image-links {
                gap: 20px; /* 画像間の間隔を調整 */
                margin: 40px 0; /* 上下のギャップを調整 */
            }
            .image {
                width: 250px; /* タブレットでの画像の幅を設定 */
            }
        }

        /* スマートフォン向けのスタイル */
        @media (max-width: 480px) {
            .small-image {
                width: 70%; /* スマートフォンでは幅を70%に設定 */
            }
            .horizontal-image-links {
                flex-direction: column; /* 画像を縦に並べる */
                gap: 15px; /* 画像間の間隔を調整 */
                margin: 20px 0; /* 上下のギャップを調整 */
            }
            .image {
                width: 100%; /* スマートフォンでの画像の幅を100%に設定 */
            }
        }
    </style>
</head>
<body>
    <img src="otoshidama.png" alt="おとしだまちゃれんじ" class="small-image">
  
    <div class="text">なまえをえらんでね</div>

    <div class="horizontal-image-links">
        <!-- 画像リンク -->
        <a href="otoshidama_hiyori.html" class="image-link">
            <img src="hiyori.png" alt="ひよりのるーれっと" class="image">
        </a>
        <!-- 画像リンク -->
        <a href="otoshidama_ayato.html" class="image-link">
            <img src="ayato.png" alt="あやとのるーれっと" class="image">
        </a>
        <!-- 画像リンク -->
        <a href="otoshidama_ruri.html" class="image-link">
            <img src="ruri.png" alt="るりのるーれっと" class="image">
        </a>
    </a>
    <!-- 画像リンク -->
    <a href="otoshidama_mio.html" class="image-link">
        <img src="mio.png" alt="るりのるーれっと" class="image">
    </a>
    </div>
</body>
</html>
