<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>おとしだまちゃれんじ</title>
    <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: 'Kosugi Maru', sans-serif;
        }
        .small-image {
            width: 90%;
            height: auto;
            max-width: 750px;
        }
        .horizontal-image-links {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin: 50px 0;
        }
        .image-link {
            border: none;
            background: none;
        }
        .image {
            max-width: 100%;
            height: auto;
        }
        .text {
            display: flex;
            align-items: center;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .small-image { width: 80%; }
            .horizontal-image-links { gap: 20px; margin: 40px 0; }
            .image { width: 250px; }
        }

        @media (max-width: 480px) {
            .small-image { width: 70%; }
            .horizontal-image-links {
                flex-direction: column;
                gap: 15px;
                margin: 20px 0;
            }
            .image { width: 100%; }
        }
    </style>
</head>
<body>
    <img src="otoshidama2026.png" alt="おとしだまちゃれんじ" class="small-image">
  
    <div class="text">おなまえは？</div>

    <!-- 音声ファイルを準備 -->
    <audio id="hiyoriSound" src="hiyori.mp3"></audio>
    <audio id="ayatoSound" src="ayato.mp3"></audio>
    <audio id="ruriSound" src="ruri.mp3"></audio>
    <audio id="mioSound" src="mio.mp3"></audio>
    <audio id="sangoSound" src="sango.mp3"></audio>

    <div class="horizontal-image-links">
        <a href="otoshidama_hiyori.html" class="image-link" onclick="playSound(event, 'hiyoriSound')">
            <img src="hiyori.png" alt="ひよりのるーれっと" class="image">
        </a>
        <a href="otoshidama_ayato.html" class="image-link" onclick="playSound(event, 'ayatoSound')">
            <img src="ayato.png" alt="あやとのるーれっと" class="image">
        </a>
        <a href="otoshidama_ruri.html" class="image-link" onclick="playSound(event, 'ruriSound')">
            <img src="ruri.png" alt="るりのるーれっと" class="image">
        </a>
        <a href="otoshidama_mio.html" class="image-link" onclick="playSound(event, 'mioSound')">
            <img src="mio.png" alt="みおのるーれっと" class="image">
        </a>
        <a href="otoshidama_sango.html" class="image-link" onclick="playSound(event, 'sangoSound')">
            <img src="sango.png" alt="さんごのるーれっと" class="image">
        </a>
    </div>

<script>
  function playSound(event, soundId) {
    event.preventDefault();
    const audio = document.getElementById(soundId);
    const targetUrl = event.currentTarget.href; // ここでリンク先を保存

    audio.currentTime = 0;
    audio.play();

    // 音声が終わったら保存したURLへ移動
    audio.addEventListener("ended", () => {
      window.location.href = targetUrl;
    }, { once: true });
  }
</script>

</body>
</html>
